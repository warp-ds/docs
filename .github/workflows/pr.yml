name: Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install
      - name: Lint
        run: pnpm lint
      - name: Test documentation review
        run: pnpm test:review-docs
      - name: Build with VitePress
        run: pnpm build
