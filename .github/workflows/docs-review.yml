name: WARP docs review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/components/**'
      - 'docs/public/components/**'

permissions:
  contents: read

concurrency:
  group: docs-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checklist:
    name: WARP docs checklist
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Check component documentation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/review-docs.mjs --base "$BASE_SHA"

  review:
    name: GPT-5.6 Sol review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout WARP Elements source
        uses: actions/checkout@v6
        with:
          repository: warp-ds/elements
          path: .review-sources/elements
          persist-credentials: false

      - name: Checkout WARP React source
        uses: actions/checkout@v6
        with:
          repository: warp-ds/react
          path: .review-sources/react
          persist-credentials: false

      - name: Checkout WARP Vue source
        uses: actions/checkout@v6
        with:
          repository: warp-ds/vue
          path: .review-sources/vue
          persist-credentials: false

      - name: Checkout WARP iOS source
        uses: actions/checkout@v6
        with:
          repository: warp-ds/warp-ios
          path: .review-sources/warp-ios
          persist-credentials: false

      - name: Checkout WARP Android source
        uses: actions/checkout@v6
        with:
          repository: warp-ds/warp-android
          path: .review-sources/warp-android
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install published documentation dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare deterministic checklist for Codex
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/review-docs.mjs --base "$BASE_SHA" --report .review-checklist.md || true

      - name: Review documentation with GPT-5.6 Sol
        id: codex
        uses: openai/codex-action@v1
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.6-sol
          effort: high
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'
          prompt-file: .github/codex/prompts/docs-review.md
          output-schema-file: .github/codex/schemas/docs-review.schema.json
          output-file: codex-review.md

  post-feedback:
    name: Post review
    needs: review
    if: needs.review.result == 'success' && needs.review.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Create or update review comment
        uses: actions/github-script@v8
        env:
          CODEX_REVIEW: ${{ needs.review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const summaryMarker = '<!-- warp-docs-codex-review -->';
            const headSha = context.payload.pull_request.head.sha;
            const reviewMarker = `<!-- warp-docs-codex-review:${headSha} -->`;

            let result;
            try {
              result = JSON.parse(process.env.CODEX_REVIEW || '');
            } catch (error) {
              core.setFailed(`Codex returned invalid JSON: ${error.message}`);
              return;
            }

            const labels = {
              component_structure: 'Component structure',
              illustrations_and_assets: 'Illustration components and asset paths',
              images_and_alt_text: 'Image transparency and alt text',
              source_accuracy: 'Claims verified against source',
              accessibility: 'Accessibility and platform differences',
              links_examples_and_completeness: 'Links, examples, and unfinished content',
            };
            const findingList = result.findings.length
              ? result.findings
                  .map((finding) =>
                    `- **[${finding.priority}] ${finding.title}** — \`${finding.path}:${finding.line}\`\n  ${finding.body}`,
                  )
                  .join('\n')
              : 'No actionable findings.';
            const checklist = Object.entries(labels)
              .map(([key, label]) => `| ${label} | ${result.checklist[key]} |`)
              .join('\n');
            const summaryBody = [
              '### Summary',
              result.summary,
              '',
              '### Findings',
              findingList,
              '',
              '### Checklist',
              '| Check | Result |',
              '| --- | --- |',
              checklist,
            ].join('\n');
            const body = `${summaryMarker}\n## WARP docs review\n\n${summaryBody}`.slice(0, 65000);

            function addedLines(patch) {
              const lines = new Set();
              let current = 0;
              for (const patchLine of (patch || '').split('\n')) {
                const header = patchLine.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (header) {
                  current = Number(header[1]);
                } else if (patchLine.startsWith('+') && !patchLine.startsWith('+++')) {
                  lines.add(current);
                  current += 1;
                } else if (!patchLine.startsWith('-') && !patchLine.startsWith('\\')) {
                  current += 1;
                }
              }
              return lines;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const changedLines = new Map(
              files.map((file) => [file.filename, addedLines(file.patch)]),
            );
            const inlineComments = result.findings
              .filter((finding) => changedLines.get(finding.path)?.has(finding.line))
              .map((finding) => ({
                path: finding.path,
                line: finding.line,
                side: 'RIGHT',
                body: `**[${finding.priority}] ${finding.title}**\n\n${finding.body}`,
              }));

            if (inlineComments.length) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
              const alreadyPosted = reviews.some((review) => review.body?.includes(reviewMarker));
              if (!alreadyPosted) {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  commit_id: headSha,
                  event: 'COMMENT',
                  body: `${reviewMarker}\n${result.summary}`,
                  comments: inlineComments,
                });
              }
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const previous = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(summaryMarker),
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
