name: WARP docs review follow-up request

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# This workflow handles untrusted comment events. It deliberately receives no
# secrets or write token; the default-branch workflow validates the live
# comment before doing any work with credentials.
permissions:
  contents: read

jobs:
  capture:
    name: Capture follow-up request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Capture event as untrusted data
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir followup-event
          jq -n \
            --arg eventName "$EVENT_NAME" \
            --slurpfile payload "$GITHUB_EVENT_PATH" \
            '{ eventName: $eventName, payload: $payload[0] }' \
            > followup-event/event.json

      - name: Upload request for trusted validation
        uses: actions/upload-artifact@v4
        with:
          name: docs-review-followup-event-${{ github.run_id }}
          path: followup-event/event.json
          retention-days: 1

